# SCN10, at every level: a conversation whose answer is the reply. The recipe's ending is
# `reply`, so the first reply ends the run with no finish to call, and the person's follow-up
# opens the next segment of the same run rather than parking it (issue #106).
name: a reply ends the run, and a follow-up starts the next
task: scenario-reply-ending
input: what is a fireside?
system: answer the person in one or two sentences
ending: reply
runs:
  - model:
      - text: "A fireside is the chair beside the fire, and the hour you spend in it."
  - follow_up: and who sits in it?
    model:
      - text: "Whoever needs the hour."
expect_events:
  - { type: run_start }
  - {
      type: message_end,
      text: "A fireside is the chair beside the fire, and the hour you spend in it.",
    }
  - { type: run_end, reason: done }
  - { type: run_end, reason: done }
expect_record:
  - { type: user_message, label: task, text: "what is a fireside?" }
  - {
      type: assistant_message,
      text: "A fireside is the chair beside the fire, and the hour you spend in it.",
    }
  - { type: user_message, label: follow_up, text: and who sits in it? }
  - { type: assistant_message, text: "Whoever needs the hour." }
  - { type: status, state: done }
